name: CNS MCDB Update

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the currently detected issues
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cns-mcdb-update-main
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certificate-backed detector dependency
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'

      - name: Detect newly released issues
        id: detect
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -m pipeline.detect_releases --state state/journal_issue_monitor_state.json $FORCE_FLAG

  generate-and-archive:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PDF renderer and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-dejavu-core

      - name: Install pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate and visually validate new PDFs
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -m pipeline.run --state state/journal_issue_monitor_state.json --output-dir pdf --reports-dir reports $FORCE_FLAG

      - name: Commit PDFs, evidence reports, and state directly to GitHub
        run: |
          if [ -z "$(git status --porcelain -- pdf reports state)" ]; then
            echo "No validated output changed."
            exit 0
          fi
          git config user.name "cns-mcdb-update[bot]"
          git config user.email "cns-mcdb-update[bot]@users.noreply.github.com"
          git add pdf reports state
          git commit -m "Archive newly released CNS biology infographics"
          git pull --rebase origin main
          git push origin HEAD:main
